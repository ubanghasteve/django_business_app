{% extends 'base.html' %}
{% block title %}Delete Job Order{% endblock %}
{% block content %}
<div class="container mt-4">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card">
        <div class="card-header bg-danger text-white">
          <h4 class="mb-0">Delete Job Order</h4>
        </div>
        <div class="card-body">
          <p>Are you sure you want to delete the job order <strong>{{ joborder.title }}</strong>?</p>
          <form method="post" class="d-inline" data-joborder-delete="true" data-offline-queue="true" data-record-uuid="{{ joborder.uuid|default:'' }}">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Yes, Delete</button>
            <a href="{% url 'job_orders:joborder_list' %}" class="btn btn-secondary">Cancel</a>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %} 

{% block extra_js %}
<script>
document.addEventListener('DOMContentLoaded', function () {
  var form = document.querySelector('form[data-joborder-delete="true"]');
  if (!form) return;

  form.addEventListener('submit', function (ev) {
    if (typeof navigator === 'undefined' ||
        navigator.onLine ||
        !window.OfflineSync ||
        typeof window.OfflineSync.wrapDelete !== 'function') {
      return;
    }

    ev.preventDefault();
    ev.stopPropagation();

    var btn = form.querySelector('button[type="submit"]');
    if (btn) {
      btn.disabled = true;
      btn.setAttribute('aria-busy', 'true');
    }

    var uuid = form.getAttribute('data-record-uuid') || '';
    if (!uuid) {
      if (btn) {
        btn.disabled = false;
        btn.removeAttribute('aria-busy');
      }
      alert('Cannot delete this job order offline because it has no sync identifier.');
      return;
    }

    var tenantId = window.OfflineSync.getTenantId ? window.OfflineSync.getTenantId() : '';

    window.OfflineSync.wrapDelete(
      'job_orders',
      uuid,
      tenantId,
      function () {
        return Promise.reject(new Error('online'));
      }
    ).then(function () {
      alert('Deletion queued offline. It will sync when you are back online.');
      window.location.href = '{% url "job_orders:products" %}';
    }).catch(function (err) {
      if (btn) {
        btn.disabled = false;
        btn.removeAttribute('aria-busy');
      }
      if (!err || err.message !== 'online') {
        alert('Could not queue this delete operation offline. Please try again when you are back online.');
      }
    });
  });
});
</script>
{% endblock %}
