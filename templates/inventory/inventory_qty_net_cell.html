{% load inventory_extras %}
<button type="button"
        class="btn btn-sm btn-link p-0 text-decoration-none qty-summary-btn w-100 text-start"
        data-pk="{{ obj.pk }}"
        data-summary-focus="net"
        title="Calculated: Qty In − Waste − Qty Out. Click for breakdown.">
    <span class="actual-qty-cell rem-qty fw-semibold {% if obj.net_quantity < 0 %}negative{% endif %}">
        {{ obj.net_quantity|format_number }}{% if obj.unit_label %} {{ obj.unit_label }}{% endif %}
    </span>
    <i class="fas fa-info-circle float-end ms-1 text-muted small" aria-hidden="true"></i>
</button>
